name = "clover-managed-relay"
main = "src/worker.mjs"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false
routes = [{ pattern = "relay.cloverai.ca", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# New phones allowed per network (IP) per UTC day. Code default is 10; raised so a whole office can connect.
MAX_ENROLLMENTS_PER_IP_DAY = "50"
ENROLLMENT_ENABLED = "true"
ALLOW_LEGACY_TEST_TRANSPORT = "true"

[[durable_objects.bindings]]
name = "INSTALLATIONS"
class_name = "Installation"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Installation", "Directory", "Guard"]
