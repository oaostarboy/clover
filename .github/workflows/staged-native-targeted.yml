name: Targeted staged native and ownership proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interrupted-recovery-${{ github.run_id }}
  cancel-in-progress: false
env:
  TARGET_REF: 826e8ff178dadf5c5eb929ea3ef4c8bb27d30b6d
  TARGET_TREE: c9aabffd29fa6d6de2732b5011274690f9e319e1
  OLD_REF: v2.0.2.11
  OLD_SHA: 9271c360f4519fc30887bbab7777c76970d4318f
  NEXT_REF: ci/native-next/staged-826e8ff1-20261106
  SETUP: zyra
  UPDATE_PATH: cli
  PHASE: old2new
  NATIVE_STAGED_ENTRY: '1'
  NATIVE_INTERRUPTED_RECOVERY: '1'
jobs:
  linux-controlled-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source-bound plan
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git -C source fetch origin "+refs/heads/$NEXT_REF:refs/remotes/origin/$NEXT_REF"
          python helpers/.github/native-proof/proof.py plan --repo source --old-ref "$OLD_REF" --target-ref "$TARGET_REF" --target-tree "$TARGET_TREE" --next-ref "$NEXT_REF" --output "$RUNNER_TEMP/evidence/plan.json"
          echo "NEXT_SHA=$(git -C source rev-parse "refs/remotes/origin/$NEXT_REF")" >> "$GITHUB_ENV"
          echo "NEXT_TREE=$(git -C source rev-parse "refs/remotes/origin/$NEXT_REF^{tree}")" >> "$GITHUB_ENV"
      - name: Verify tracer capabilities before installation
        shell: bash
        run: |
          command -v strace
          strace --version
          strace --kill-on-exit -I 1 -ff -ttt -e trace=process -o "$RUNNER_TEMP/evidence/strace-preflight" /usr/bin/true
      - name: Controlled crash and recovery
        timeout-minutes: 35
        shell: bash
        run: bash helpers/.github/native-proof/posix.sh old2new
      - name: Preserve installer diagnostics independently of shell traps
        if: always()
        shell: bash
        env:
          NATIVE_COLLECT_INSTALL_EVIDENCE_ONLY: '1'
        run: |
          if [[ -f "$RUNNER_TEMP/install-diagnostics-before.json" ]]; then
            bash helpers/.github/native-proof/posix.sh old2new
          else
            printf 'No installer-start diagnostic was recorded\n' > "$RUNNER_TEMP/evidence/install-collection-missing.txt"
            exit 1
          fi
      - name: Record row
        if: always()
        shell: bash
        env:
          ROW_STATUS: ${{ job.status }}
        run: python helpers/.github/native-proof/row.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-interrupted-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
