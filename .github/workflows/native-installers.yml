name: Native installers (manual, no release)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch the installers install from
        default: onboarding/tui-first-pass
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .exe with NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          $o = "$PWD\out\Clover-Setup-$ver-windows-x64.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver "/DBRANCH=${{ inputs.branch }}" "/DOUTFILE=$o" packaging\windows\clover.nsi
          if ($LASTEXITCODE) { exit 1 }
          Get-Item $o | Format-List Name,Length
      - name: Silent install on the runner
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out\*.exe)[0].FullName
          $p = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          "installer exit: $($p.ExitCode)"
          Get-ChildItem "$env:LOCALAPPDATA\Clover Installer" | Format-Table Name,Length
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Clover\Clover.lnk"
      - name: clover --version in a fresh shell
        shell: cmd
        run: |
          set "PATH=%LOCALAPPDATA%\clover\clover-c1\venv\Scripts;%PATH%"
          dir "%LOCALAPPDATA%\clover\clover-c1\venv\Scripts\clover.exe"
          clover --version
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: out/*.exe }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg
        run: |
          ver=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          bash packaging/macos/build-pkg.sh "$ver" "${{ inputs.branch }}" out
          pkgutil --check-signature out/*.pkg || true
          pkgutil --payload-files out/*.pkg | head -20
      - uses: actions/upload-artifact@v4
        with: { name: macos-pkg-unsigned-ci, path: out/*.pkg }
