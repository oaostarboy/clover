name: Disposable macOS user-domain isolation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-user-domain:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - name: Checkout pinned product for identity only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source
          ref: a62d59e895c723623fe0edc952e8c480bfc6f322
          persist-credentials: false
      - name: Verify source identity and run one diagnostic
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git -C source rev-parse HEAD > "$RUNNER_TEMP/evidence/product-sha.txt"
          git -C source rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/product-tree.txt"
          test "$(git -C source rev-parse HEAD)" = a62d59e895c723623fe0edc952e8c480bfc6f322
          test "$(git -C source rev-parse 'HEAD^{tree}')" = e56d299cf8bf63fafea6f619c05a7590e1954685
          shasum -a 256 helpers/.github/native-proof/macos_user_isolation_probe.py > "$RUNNER_TEMP/evidence/script-sha256.txt"
          /usr/bin/python3 helpers/.github/native-proof/macos_user_isolation_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-user-isolation-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
