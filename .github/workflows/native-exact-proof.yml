name: Windows full Stop and handoff proof
on:
  push:
    branches: [ci/windows-repair-focused-ce418d93]
permissions:
  contents: read
jobs:
  stop:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ce418d930a933b8ce19ea633b33031751b6e049a
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install disposable test dependencies
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' 'python-telegram-bot[webhooks]==22.8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full native Stop suite
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER='1'
          $env:CLOVER_SAFE_MODE='1'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          $out = Join-Path $env:RUNNER_TEMP 'windows-stop-suite'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File "$out/commit.txt" -Encoding utf8
          git rev-parse 'HEAD^{tree}' | Out-File "$out/tree.txt" -Encoding utf8
          $args_ = @('-m','pytest','-p','pytest_asyncio.plugin','tests/cron/test_workstream_dm_runtime.py','-vv','-s','--durations=0','-o','faulthandler_timeout=30')
          $p = Start-Process -FilePath (Get-Command python).Source -ArgumentList $args_ -RedirectStandardOutput "$out/stop.log" -RedirectStandardError "$out/stop.err" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(600000)) { & taskkill /PID $p.Id /T /F | Out-Null; exit 124 }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-stop-suite
          path: ${{ runner.temp }}/windows-stop-suite/
          if-no-files-found: warn
          retention-days: 3
