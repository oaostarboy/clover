name: Windows final repair clock and Stop proof
on:
  push:
    branches: [ci/windows-repair-focused-ce418d93]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 89b62ae5f7d1a00ace16652e95003f5523a93a94
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install disposable test dependencies
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' 'python-telegram-bot[webhooks]==22.8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native exact-commit tests
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER='1'; $env:CLOVER_SAFE_MODE='1'; $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          $out = Join-Path $env:RUNNER_TEMP 'windows-final-tests'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File "$out/commit.txt" -Encoding utf8
          git rev-parse 'HEAD^{tree}' | Out-File "$out/tree.txt" -Encoding utf8
          $tests = @(
            @{name='clock'; file='tests/clover_cli/test_windows_handoff_clock_native.py'},
            @{name='receipt'; file='tests/clover_cli/test_windows_update_receipt_handoff.py'},
            @{name='handoff'; file='tests/agent/test_handoff_windows_permissions.py'},
            @{name='stop'; file='tests/cron/test_workstream_dm_runtime.py'},
            @{name='report'; file='tests/gateway/test_workstream_acceptance.py'}
          )
          $failed=$false
          foreach ($test in $tests) {
            $name=$test.name
            $args_ = @('-m','pytest','-p','pytest_asyncio.plugin',$test.file,'-vv','-s','--durations=0','-o','faulthandler_timeout=30')
            $p = Start-Process -FilePath (Get-Command python).Source -ArgumentList $args_ -RedirectStandardOutput "$out/$name.log" -RedirectStandardError "$out/$name.err" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(600000)) { & taskkill /PID $p.Id /T /F | Out-Null; $rc=124 } else { $rc=$p.ExitCode }
            "$name exit=$rc" | Tee-Object -FilePath "$out/results.txt" -Append
            if ($rc -ne 0) { $failed=$true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-final-tests
          path: ${{ runner.temp }}/windows-final-tests/
          if-no-files-found: warn
          retention-days: 3
