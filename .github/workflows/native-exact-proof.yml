name: Windows baseline and concurrent report diagnostic
on:
  push:
    branches: [ci/windows-repair-focused-ce418d93]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helper
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source
          ref: ce418d930a933b8ce19ea633b33031751b6e049a
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: baseline
          ref: 8b02bff8c02c79bf177b9b3c07a382afef16a935
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install disposable test dependencies
        shell: pwsh
        run: |
          python -m pip install -e './source[dev]' 'python-telegram-bot[webhooks]==22.8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact source and compare
        shell: pwsh
        run: |
          git -C source rev-parse HEAD
          git -C baseline rev-parse HEAD
          python helper/.github/native-proof/windows-comparison.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-comparison-evidence
          path: ${{ runner.temp }}/windows-comparison/
          if-no-files-found: warn
          retention-days: 3
