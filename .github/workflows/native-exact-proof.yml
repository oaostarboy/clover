name: Windows repair candidate-to-marker update proof
on:
  push:
    branches: [ci/windows-repair-update-ce418d93]
permissions:
  contents: read
env:
  OLD_REF: v2.0.2.11
  TARGET_REF: ce418d930a933b8ce19ea633b33031751b6e049a
  TARGET_TREE: eba59422b21386d6b811885a7aad8647de4ef3b0
  NEXT_REF: ci/native-next/windows-repair-ce418d93
  OLD_SHA: 9271c360f4519fc30887bbab7777c76970d4318f
  NEXT_SHA: cd3d7ba69b34abda06f167ecb30ca2fd09c8bde2
  NEXT_TREE: 5a19c0264fdcca252c8f1aa55fa2b01d62934f34
jobs:
  update:
    name: Windows ${{ matrix.setup }} ${{ matrix.path }} candidate-to-marker
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        setup: [troy, zyra]
        path: [cli, chat]
    env:
      SETUP: ${{ matrix.setup }}
      UPDATE_PATH: ${{ matrix.path }}
      PHASE: new2next
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Fetch exact marker branch
        shell: bash
        run: git -C source fetch origin "+refs/heads/$NEXT_REF:refs/remotes/origin/$NEXT_REF"
      - name: Native supervisor update and owner evidence
        shell: pwsh
        run: ./helpers/.github/native-proof/windows.ps1 -Mode new2next
      - name: Preserve actual row outcome
        if: always()
        shell: bash
        env:
          ROW_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python helpers/.github/native-proof/row.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: update-${{ matrix.setup }}-${{ matrix.path }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          include-hidden-files: true
          if-no-files-found: error
