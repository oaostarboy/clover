name: Windows focused repair diagnostic
on:
  push:
    branches: [ci/windows-repair-focused-ce418d93]
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ce418d930a933b8ce19ea633b33031751b6e049a
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install disposable test dependencies
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' 'python-telegram-bot[webhooks]==22.8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run pinned tests and retain evidence
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER='1'
          $env:CLOVER_SAFE_MODE='1'
          $out = Join-Path $env:RUNNER_TEMP 'windows-repair-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File "$out/commit.txt" -Encoding utf8
          git rev-parse 'HEAD^{tree}' | Out-File "$out/tree.txt" -Encoding utf8
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          $tests = @(
            @{name='handoff'; args=@('tests/agent/test_handoff_windows_permissions.py','-vv','--durations=0')},
            @{name='stop'; args=@('tests/cron/test_workstream_dm_runtime.py::test_pending_stop_uses_real_agent_interrupt_and_never_executes','-vv','-s','--durations=0','-o','faulthandler_timeout=30')},
            @{name='report'; args=@('tests/gateway/test_workstream_acceptance.py','-vv','-s','--durations=0','-o','faulthandler_timeout=30')}
          )
          $failed = $false
          foreach ($test in $tests) {
            $name=$test.name
            $arguments = @('-m','pytest','-p','pytest_asyncio.plugin') + $test.args
            $p = Start-Process -FilePath (Get-Command python).Source -ArgumentList $arguments -RedirectStandardOutput "$out/$name.log" -RedirectStandardError "$out/$name.err" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(360000)) {
              & taskkill /PID $p.Id /T /F | Out-Null
              $rc=124
            } else { $rc=$p.ExitCode }
            "$name exit=$rc" | Tee-Object -FilePath "$out/results.txt" -Append
            if ($rc -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-focused-evidence
          path: ${{ runner.temp }}/windows-repair-evidence/
          if-no-files-found: warn
          retention-days: 3
