name: Bounded Windows native exception capture
on:
  push:
    branches: [ci/windows-native-debug-bounded]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install frozen baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'crash-probe'; New-Item -ItemType Directory -Force $out | Out-Null
          git worktree add --detach "$env:RUNNER_TEMP/base" ce418d930a933b8ce19ea633b33031751b6e049a
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          python -m pip install -r .github/windows-crash-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          Push-Location "$env:RUNNER_TEMP/base"
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'editable install failed' }
          python -m pip freeze | Out-File "$out/dependencies.txt"
          python -VV 2>&1 | Out-File "$out/python.txt"
          git rev-parse HEAD | Out-File "$out/source.txt"
          Pop-Location
      - name: Check and provision Microsoft Sysinternals ProcDump
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'crash-probe'
          Get-Command procdump,procdump64,cdb -ErrorAction SilentlyContinue | Select-Object Name,Source | Out-File "$out/debugger-before.txt"
          $p=Get-Command procdump64,procdump -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $p) {
            choco install procdump --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ProcDump installation failed' }
            $p=Get-Command procdump64,procdump -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $p) { throw 'ProcDump not on PATH after install' }
          $p.Source | Out-File "$out/procdump-path.txt"
          "PROCDUMP_PATH=$($p.Source)" | Out-File $env:GITHUB_ENV -Append
          $candidates=@('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe','C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe')
          $candidates | ForEach-Object { "$_ : $(Test-Path $_)" } | Out-File "$out/cdb-availability.txt"
      - name: Compare timer with scoped process capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'crash-probe'; $source=Join-Path $env:RUNNER_TEMP 'base'
          $env:PYTHONPATH=$source; $env:PYTHONFAULTHANDLER='1'; $env:CLOVER_SAFE_MODE='1'; $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          Push-Location $source
          foreach ($timeout in @(30,0)) {
            $name="timer-$timeout"; $env:CLOVER_HOME=Join-Path $env:RUNNER_TEMP "home-$name"
            $dump=Join-Path $out "dumps-$name"; New-Item -ItemType Directory -Force $env:CLOVER_HOME,$dump | Out-Null
            $args_=@('-accepteula','-e','-ma','-x',$dump,(Get-Command python).Source,'-m','pytest','-p','pytest_asyncio.plugin','tests/clover_cli/test_windows_update_receipt_handoff.py::test_immutable_legacy_publisher_uses_proven_parent_phase_not_child_clock_tick','-vv','-s','--durations=0','-o',"faulthandler_timeout=$timeout")
            $start=Get-Date
            $p=Start-Process -FilePath $env:PROCDUMP_PATH -ArgumentList $args_ -RedirectStandardOutput "$out/$name.log" -RedirectStandardError "$out/$name.err" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(600000)) { & taskkill /PID $p.Id /T /F | Out-Null; $rc=124 } else { $rc=$p.ExitCode }
            @{case=$name; debugger_pid=$p.Id; exit=$rc; start=$start.ToUniversalTime().ToString('o'); end=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json -Compress | Add-Content "$out/results.jsonl"
            $cdb=@('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe','C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe') | Where-Object {Test-Path $_} | Select-Object -First 1
            if ($cdb) { Get-ChildItem $dump -Filter '*.dmp' | ForEach-Object { & $cdb -z $_.FullName -c '.ecxr; r; kv; lm; q' 2>&1 | Out-File "$out/$name-native.txt" } }
          }
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-exception-evidence
          path: ${{ runner.temp }}/crash-probe/
          if-no-files-found: error
          retention-days: 7
